<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Démo légère : NOM DE L'EFFET</title>
<style>
/* Démo de validation, volontairement NON adaptée à inwink : on juge l'effet, pas l'intégration. */
:root{--f:1;--accent:#2F4BE0}
body{margin:0;background:#EEF0F4;color:#141A26;font:16px/1.6 system-ui,sans-serif;padding:0 20px 60vh}
header{max-width:1000px;margin:0 auto;padding:40px 0 70vh}
.panneau{position:fixed;right:16px;bottom:16px;background:#fff;padding:12px 14px;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.15);font-size:.85rem}
.bloc{max-width:1000px;margin:0 auto 60vh;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;background:#fff;padding:32px;border-radius:6px;view-timeline:--b block;view-timeline-inset:0% 25%}
.bloc.inverse .img{order:2}
.img{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:4px;background:#CDD3DE}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.pre{color:var(--accent);font-weight:700;margin:0 0 .4rem}
h2{font-size:2rem;line-height:1.15;margin:0 0 .8rem}
.txt p{color:#586174;margin:0 0 1.2rem}
.btn{display:inline-block;background:var(--accent);color:#fff;padding:.7rem 1.2rem;border-radius:4px;text-decoration:none;font-weight:700}
@media (max-width:720px){.bloc{grid-template-columns:1fr}}

/* ===== EFFET (variante A) ===== */
@supports (animation-timeline: view()){
  .va .img{animation:a-exemple linear both;animation-timeline:--b;animation-range:entry 0% entry 60%}
}
@keyframes a-exemple{from{opacity:0;transform:translateY(calc(80px * var(--f)))}}
</style>
</head>
<body>
<header><h1>NOM DE L'EFFET</h1><p>Faites défiler. Variantes : A, B… Curseur : intensité.</p></header>

<section class="bloc va">
  <div class="img"><img src="https://picsum.photos/seed/txim-a/900/675" alt=""></div>
  <div class="txt"><p class="pre">Pré-titre</p><h2><span>Un titre sur deux lignes pour juger l'effet</span></h2>
    <p><span>Une description de deux ou trois lignes, pour voir comment le texte réagit à l'effet pendant le défilement.</span></p>
    <a class="btn" href="#">Bouton</a></div>
</section>
<!-- Dupliquer la section avec class="bloc vb inverse" pour une variante B, image à droite. -->

<div class="panneau"><label>Intensité <input type="range" min=".5" max="2" step=".25" value="1"
  oninput="document.documentElement.style.setProperty('--f', this.value)"></label></div>
</body>
</html>
